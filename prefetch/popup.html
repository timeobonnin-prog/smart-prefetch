<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Smart Prefetch</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Smart Prefetch</h1>
    <span id="version">v2.0.0</span>
  </header>

  <section class="stats">
    <div class="stat"><span class="label">Pages prechargees</span><span class="value" id="prefetched">0</span></div>
    <div class="stat"><span class="label">Hits (cache)</span><span class="value" id="hits">0</span></div>
    <div class="stat"><span class="label">Temps gagne</span><span class="value" id="saved">0 s</span></div>
    <div class="stat"><span class="label">Mesures</span><span class="value" id="measures">0</span></div>
  </section>

  <section class="toggle">
    <label>
      <input type="checkbox" id="enabled-toggle">
      <span>Activer sur ce site</span>
    </label>
  </section>

  <section class="hosts">
    <h2>Top sites</h2>
    <ul id="hosts-list"></ul>
  </section>

  <footer>
    <button id="prefetch-all">⚡ Prefetch this page</button>
    <button id="open-options">⚙ Options</button>
    <button id="reset">Reinitialiser</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
